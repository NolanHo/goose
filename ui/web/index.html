<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws: wss: https:; object-src 'none'; font-src 'self' data: https:; media-src 'self' mediastream: blob: data:; form-action 'none'; base-uri 'self'; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self' https: http:;"
    />
    <title>Goose Web</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('goose-web-settings');
          var theme = 'light';
          if (raw) {
            var s = JSON.parse(raw);
            var useSystem = s.useSystemTheme !== false;
            var saved = s.theme;
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = useSystem ? (prefersDark ? 'dark' : 'light') : (saved || 'light');
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
